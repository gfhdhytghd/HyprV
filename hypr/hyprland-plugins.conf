# when enter overview, you can use left-button to jump, right-button to kill or use keybind

# bind key to toggle overview(force mode,no affected by `only_active_workspace` and `only_active_monitor`)
#bind = alt,TAB,hycov:toggleoverview,forceall
bind = SUPER, TAB, hymission:toggle
gesture = 4, vertical,mod: SUPER, dispatcher, hymission:toggle,recommand
plugin {
    hymission {
        toggle_switch_mode=1
        switch_release_key=Super_L
        switch_toggle_auto_next=1
        expand_selected_window = 1
        multi_workspace_sort_recent_first = 1
        one_workspace_per_row = 0
        outer_padding_top = 92
        outer_padding_right = 32
        outer_padding_bottom = 32
        outer_padding_left = 32
        row_spacing = 32
        column_spacing = 32
        min_window_length = 120
        small_window_boost = 1.35
        max_preview_scale = 0.95
        min_slot_scale = 0.10
        layout_scale_weight = 1.0
        layout_space_weight = 0.10
        overview_focus_follows_mouse = 1
        only_active_workspace = 0
        workspace_change_keeps_overview = 1
        hide_bar_when_strip = 1
        hide_bar_animation = 1
        hide_bar_animation_blur = 1
        hide_bar_animation_move_multiplier = 0.8
        hide_bar_animation_scale_divisor = 1.1
        hide_bar_animation_alpha_end = 0
        bar_single_mission_control = 0
        show_focus_indicator = 0
        workspace_strip_anchor = left
        workspace_strip_thickness = 160
        workspace_strip_gap = 24
    }
}
# use keyname
plugin {
    hycov {
        overview_gappo = 10 # gaps width from screen edge
        overview_gappi = 10 # gaps width from clients
        hotarea_size = 10 # hotarea size in bottom left,10x10
        enable_hotarea = 0 # enable mouse cursor hotarea
        move_focus_distance = 100 # distance for movefocus,only can use 3 finger to move
        height_of_titlebar = 60
        #enable_gesture = 1 # enable touchpad gesture to toggle overview
        #swipe_fingers = 4 # number of fingers for gesture (3-4 recommended)
        #move_focus_distance = 100 # swipe distance to move focus in overview

        disable_workspace_change = 1 # disable workspace change when in overview mode
        disable_spawn = 1 # disable bind exec when in overview mode
        auto_exit = 1 # enable auto exit when no client in overview
        auto_fullscreen = 0 # auto make active window maximize after exit overview
        only_active_workspace = 0 # only overview the active workspace
        only_active_monitor = 1 # only overview the active monitor
        enable_alt_release_exit = 1 # alt swith mode,see readme for detail
        alt_toggle_auto_next = 1 # auto focus next window when toggle overview in alt swith mode
        #alt_replace_key = alt
        click_in_cursor = 1 # target windwo is find by cursor, not the current foucus window.
    }
}
