# SuperPower desktop: let Hyprland select every connected output at its
# preferred mode. This avoids carrying laptop-specific eDP/DP geometry over.
monitor = , preferred, auto, 1
monitorv2 {
    output = HEADLESS-1
    mode = 2732x2048@120
    position = 0x0
    scale = 2
    transform = 0
    bitdepth = 10
    cm = srgb
}

exec-once = xrdb ~/.Xresources
