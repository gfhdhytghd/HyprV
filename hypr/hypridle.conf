$lock_cmd = pidof hyprlock || sh -lc '~/.config/hypr/sakoora.hyprlock/hyprlock-run/panels && hyprlock'
$suspend_cmd = pidof steam || systemctl suspend || loginctl suspend # fuck nvidia

general {
    lock_cmd = $lock_cmd
    #before_sleep_cmd = loginctl lock-session
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors

}

listener {
    timeout = 180 # 3mins
    on-timeout = sh -c 'grep -qs Discharging /sys/class/power_supply/BAT*/status && hyprlock'
}

listener {
    timeout = 240 # 4mins
    on-timeout = sh -c 'grep -qs Discharging /sys/class/power_supply/BAT*/status && hyprctl dispatch dpms off'
    on-resume = hyprctl dispatch dpms on
}

