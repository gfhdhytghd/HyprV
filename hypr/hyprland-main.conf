
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    layout = scrolling
    #layout = master
}

scrolling {
    fullscreen_on_one_column = true
    column_width = 0.85
    focus_fit_method = 1 
    # Keep the layout stable when focus changes, so terminals don't appear to
    # "shrink" just because pointer focus moved to another tiled window.
    follow_focus=true
    follow_min_visible=0.14
    # `follow_debounce_ms` was a hyprscrolling plugin option and is not available in built-in scrolling.
}
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        drag_lock=false
        disable_while_typing = false
    }
    
    sensitivity = +0.1 # -1.0 - 1.0, 0 means no modification.
}
render {
    direct_scanout = true
}
cursor {
    # 0=尽量用硬件光标, 1=禁用硬件光标, 2=自动
    no_hardware_cursors = 1
}

device {
    name = “apple”的鼠标
    sensitivity = -0.4
}

device {
    name = logitech-usb-receiver-mouse
    enabled = true
    sensitivity = -0.3
    accel_profile  = flat
}

device {
    name = elan900c:00-04f3:4216
    output = eDP-1
    transform = 0
}

device {
    name = touch-passthrough
    output = HEADLESS-1
    transform = 1
}

misc {
    disable_hyprland_logo = yes
}
master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
}

gestures {
    workspace_swipe_cancel_ratio = 0.05
    workspace_swipe_touch = true
}

gesture = 4, vertical, workspace
#gesture = 4, vertical, fullscreen,1
gesture = 4, horizontal, dispatcher, hymission:scroll,layout
#gesture = 4, , dispatcher, hycov:toggleoverview,forceall
#gesture = 4, up, dispatcher,exec, $HOME/.config/HyprV/hypr/scripts/hycov.sh --ovon
#gesture = 4, down, dispatcher,exec, $HOME/.config/HyprV/hypr/scripts/hycov.sh --ovoff
gesture = 3, horizontal, dispatcher, exec, $HOME/.config/HyprV/hypr/scripts/sidechat.sh
gesture = 3, vertical, dispatcher, exec, $HOME/.config/HyprV/hypr/scripts/dropdown.sh
gesture = 3, vertical, mod: SUPER, dispatcher, exec, $HOME/.config/HyprV/hypr/scripts/dropcalender.sh
gesture = 3, swipe, mod: SUPER, scale: 1.5, move

bind = SUPER SHIFT, right, layoutmsg, swapcol r
bind = SUPER SHIFT, left, layoutmsg, swapcol l
bind = SUPER CTRL, right, layoutmsg, promote
#bind = SUPER CTRL, left, layoutmsg, promote
bind = SUPER SHIFT,code:35, layoutmsg, colresize +0.1
bind = SUPER SHIFT,code:34, layoutmsg, colresize -0.1

animations {
  # 竖直滑动：上下滚
  #animation = workspaces, 1, 8, default, slidevert
  animation = workspaces, 1, 8, default, slidevert
  animation = workspacesIn, 1, 8, default, slidevert
  #animation = workspacesIn, 1, 10, wiggle, slidevert
  animation = workspacesOut, 1, 8, default, slidevert
}


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more


xwayland {
  force_zero_scaling = true
}

#source = ~/.config/hypr/hypridle.conf
