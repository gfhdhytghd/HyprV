# HyprV kitty — fonts, motion, layout
# Colors come from current-theme.conf (light/dark switched by apply-ui-state)

# BEGIN_KITTY_THEME
# switched by apply-ui-state → ~/.config/kitty/current-theme.conf
include ~/.config/kitty/current-theme.conf
# END_KITTY_THEME

#: Fonts — Iosevka mono + HarmonyOS Sans CJK
font_family      Iosevka Term
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# CJK / fullwidth punctuation / kana / hangul → HarmonyOS Sans SC
symbol_map U+2E80-U+2EFF,U+2F00-U+2FDF,U+2FF0-U+2FFF,U+3000-U+303F,U+3040-U+30FF,U+3100-U+312F,U+3130-U+318F,U+31A0-U+31BF,U+31C0-U+31EF,U+31F0-U+31FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+AC00-U+D7AF,U+F900-U+FAFF,U+FF00-U+FFEF HarmonyOS Sans SC
# Nerd / powerline icons → Iosevka Nerd Font Mono
symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F532,U+F0001-U+F1AF0 Iosevka Nerd Font Mono

#: Cursor + animations (enable the nice ones)
cursor_shape               block
cursor_shape_unfocused     hollow
cursor_beam_thickness      1.5
cursor_underline_thickness 2.0
cursor_blink_interval      0
cursor_trail               180
cursor_trail_decay         0.08 0.32
cursor_trail_start_threshold 2

#: Visual bell (short, low-contrast animated fade)
enable_audio_bell          no
visual_bell_duration       0.12 ease-out
window_alert_on_bell       yes
bell_on_tab                "🔔 "

#: Window / opacity — blur comes from Hyprland (decoration.blur), not kitty
background_opacity         0.87
dynamic_background_opacity yes
window_padding_width       6
window_border_width        1.0pt
draw_window_borders_for_single_window no
hide_window_decorations    yes
confirm_os_window_close    -1
enabled_layouts            splits, stack

#: Tab bar (fade style reads smoothly with theme colors)
tab_bar_edge               bottom
tab_bar_style              fade
tab_bar_align              left
tab_bar_min_tabs           2
tab_fade                   0.2 0.4 0.7 1.0
tab_title_template         "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
active_tab_font_style      bold
inactive_tab_font_style    normal

#: Scrollback / scrollbar
scrollback_lines           10000
scrollback_pager_history_size 64
scrollbar                  scrolled
wheel_scroll_multiplier    3.0
touch_scroll_multiplier    1.0

#: Performance (smooth redraw for animations)
input_delay                2
sync_to_monitor            yes

#: UX
mouse_hide_wait            2.0
url_style                  curly
copy_on_select             yes
strip_trailing_spaces      smart
disable_ligatures          never
shell_integration          enabled

#: Remote control (theme reload + scripting)
allow_remote_control       socket-only
listen_on                  unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}.sock

#: Keymaps — only non-defaults; finer opacity steps than the stock ±0.1
map ctrl+shift+t           new_tab_with_cwd
map ctrl+shift+a>m         set_background_opacity +0.05
map ctrl+shift+a>l         set_background_opacity -0.05
