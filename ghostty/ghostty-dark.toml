# Dark profile synced from Konsole (Dark.profile -> One-Dark.colorscheme)
font-family = Iosevka Fixed
font-size = 11

background = #1e222a
foreground = #fcfcfc
selection-background = #89b4fa
selection-foreground = #1e222a
cursor-color = #fcfcfc
cursor-text = #1e222a
cursor-style = block
cursor-style-blink = false

palette = 0=#272b32
palette = 1=#d2646d
palette = 2=#a6e3a1
palette = 3=#f9e2af
palette = 4=#89b4fa
palette = 5=#f5c2e7
palette = 6=#94e2d5
palette = 7=#bac2de
palette = 8=#7f8c8d
palette = 9=#b4565e
palette = 10=#a6e3a1
palette = 11=#f9e2af
palette = 12=#64b5f3
palette = 13=#f5c2e7
palette = 14=#94e2d5
palette = 15=#a6adc8

background-opacity = 0.7
confirm-close-surface = false
window-padding-x = 4
window-padding-y = 4
keybind = ctrl+shift+t=new_tab

# GTK tabbar styling (adapted from Konsole tabbar)
window-show-tab-bar = auto
gtk-titlebar-style = tabs
gtk-tabs-location = bottom
gtk-wide-tabs = false
gtk-custom-css = /home/wilf/.config/HyprV/ghostty/ghostty-tabbar.css
