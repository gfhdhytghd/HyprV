[package]
name = "hyprv-privhelper"
version.workspace = true
edition.workspace = true
[dependencies]
hyprv-core = { path = "../hyprv-core" }
tokio = { version = "1.54", features = ["rt", "macros", "signal", "sync", "time", "net"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
