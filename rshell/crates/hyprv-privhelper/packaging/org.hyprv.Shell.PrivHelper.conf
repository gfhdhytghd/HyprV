<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.hyprv.Shell.PrivHelper"/></policy>
  <policy context="default">
    <allow send_destination="org.hyprv.Shell.PrivHelper" send_interface="org.hyprv.Shell.PrivHelper1" send_member="GetFans"/>
    <allow send_destination="org.hyprv.Shell.PrivHelper" send_interface="org.hyprv.Shell.PrivHelper1" send_member="SubscribeCpuPower"/>
    <allow send_destination="org.hyprv.Shell.PrivHelper" send_interface="org.hyprv.Shell.PrivHelper1" send_member="UnsubscribeCpuPower"/>
    <allow send_destination="org.hyprv.Shell.PrivHelper" send_interface="org.hyprv.Shell.PrivHelper1" send_member="SetFanLimit"/>
    <allow send_destination="org.hyprv.Shell.PrivHelper" send_interface="org.hyprv.Shell.PrivHelper1" send_member="RemoveExternalGpu"/>
    <allow send_destination="org.hyprv.Shell.PrivHelper" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.hyprv.Shell.PrivHelper" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.hyprv.Shell.PrivHelper" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.hyprv.Shell.PrivHelper" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
