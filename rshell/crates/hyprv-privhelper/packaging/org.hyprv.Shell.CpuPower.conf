<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.hyprv.Shell.CpuPower"/></policy>
  <policy context="default">
    <allow send_destination="org.hyprv.Shell.CpuPower" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.hyprv.Shell.CpuPower" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.hyprv.Shell.CpuPower" send_interface="org.hyprv.Shell.CpuPower1"/>
  </policy>
</busconfig>
