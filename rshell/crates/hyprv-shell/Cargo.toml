[package]
name = "hyprv-shell"
version.workspace = true
edition.workspace = true
[dependencies]
hyprv-core = { path = "../hyprv-core" }
serde_json = "1"
serde = {version="1",features=["derive"]}
hyprv-ui = { path = "../hyprv-ui" }
hyprv-widgets = { path = "../hyprv-widgets", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hyprv-ui-bar = { path = "../hyprv-ui-bar" }
hyprv-ui-panels = { path = "../hyprv-ui-panels" }
hyprv-svc-media = { path = "../hyprv-svc-media" }
hyprv-svc-net = { path = "../hyprv-svc-net" }
hyprv-svc-power = { path = "../hyprv-svc-power" }
hyprv-svc-sys = { path = "../hyprv-svc-sys" }
hyprv-svc-desktop = { path = "../hyprv-svc-desktop" }
hyprv-ui-island = { path = "../hyprv-ui-island" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Placeholder system-bus connection when the bus is unavailable (src/system_bus.rs).
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

zeroize = "1"
sha2 = "0.10"

wayland-client = {version="0.31", features=["system"]}
wayland-protocols-wlr = {version="0.3",features=["client"]}
wayland-scanner = "0.31"
wayland-backend = "0.3"
xkbcommon = "0.8"

[dev-dependencies]
wayland-client = "0.31"
