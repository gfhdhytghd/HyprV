[package]
name = "hyprv-svc-power"
version.workspace = true
edition.workspace = true
[dependencies]
hyprv-core = { path = "../hyprv-core" }
hyprv-privhelper = { path = "../hyprv-privhelper" }
tokio = { version = "1.54", features = ["rt", "sync", "time", "net", "io-util", "macros", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
libc = "0.2"
[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }

zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
