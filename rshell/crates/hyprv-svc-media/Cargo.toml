[package]
name = "hyprv-svc-media"
build = "build.rs"
links = "hyprv_cavacore"
version.workspace = true
edition.workspace = true

[dependencies]
hyprv-core = { path = "../hyprv-core" }
tokio = { version = "1.54", features = ["rt", "sync", "net", "time", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
pipewire = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt", "sync", "time", "macros", "test-util"] }
