[package]
name = "hyprv-core"
version.workspace = true
edition.workspace = true

[dependencies]
calloop = "0.13"
tokio = { version = "1.54", features = ["rt", "sync", "net", "time", "io-util", "macros", "signal"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
