[package]
name = "hyprv-ui"
version.workspace = true
edition.workspace = true
license = "MIT AND BSD-3-Clause AND LGPL-3.0-only AND FTL"
description = "Event-driven retained Skia/Wayland engine for HyprV"

[dependencies]
glow = "0.16"
skia-safe = { version = "0.90", features = ["gl", "textlayout", "svg"] }
smithay-client-toolkit = "0.19.2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-egl = "0.32"
calloop = "0.13"
calloop-wayland-source = "0.3"
khronos-egl = { version = "6", features = ["dynamic"] }
thiserror = "2"
freetype-rs = "0.38"
unicode-segmentation = "1"

[dev-dependencies]
serde_json = "1"

[[example]]
name = "demo"
path = "examples/demo.rs"

[build-dependencies]
cc = "1"
