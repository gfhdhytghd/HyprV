[package]
name = "hyprv-svc-net"
version = "0.1.0"
edition = "2021"

[dependencies]
hyprv-core = { path = "../hyprv-core" }
tokio = { version = "1.54", features = ["rt", "sync", "net", "time", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-trait = "0.1"
libc = "0.2"
zeroize = "1.9"
aes = "0.8"
hkdf = "0.12"
sha2 = "0.10"
crypto-bigint = { version = "0.5", features = ["zeroize"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }
