[package]
name = "hyprv-ui-bar"
version.workspace = true
edition.workspace = true
[dependencies]
hyprv-core = { path = "../hyprv-core" }
hyprv-ui = { path = "../hyprv-ui" }
hyprv-widgets = { path = "../hyprv-widgets" }
hyprv-svc-power = { path = "../hyprv-svc-power" }
hyprv-svc-sys = { path = "../hyprv-svc-sys" }
hyprv-svc-media = { path = "../hyprv-svc-media" }
hyprv-svc-net = { path = "../hyprv-svc-net" }
serde_json = "1"
resvg = { version = "0.45.1", default-features = false }
freetype-rs = "0.38"

[dev-dependencies]
hyprv-ui-island = { path = "../hyprv-ui-island" }
hyprv-ui-panels = { path = "../hyprv-ui-panels", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-client = { version = "0.31", features = ["system"] }
